<!doctype html>
<!-- Minimal API landing stub for the Event Ticketing backend. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Treean API status and documentation links.">
  <title>Treean API</title>
  <style>
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background-color: #fafafa;
      color: #18181b;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #d4d4d8;
      padding: 1.5rem;
    }
    h1 {
      margin: 0 0 0.75rem 0;
      font-size: 1.5rem;
      line-height: 1.25;
    }
    p {
      margin: 0 0 1rem 0;
      color: #3f3f46;
    }
    ul {
      list-style: none;
      margin: 1.25rem 0 0 0;
      padding: 0;
      display: grid;
      gap: 0.5rem;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d4d4d8;
      color: #1d4ed8;
      font-weight: 600;
      text-decoration: none;
      width: 100%;
    }
    a:hover {
      background-color: #eff6ff;
      border-color: #1d4ed8;
    }
    a:focus-visible {
      outline: 2px solid #1d4ed8;
      outline-offset: 2px;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Treean API</h1>
    <p>Backend service landing stub. Use the React + Vite frontend (<code>:5173</code> in local dev or <code>:3000</code> in Docker Compose) for the interactive UI.</p>
    <p>Live backend endpoints:</p>
    <ul>
      <li><a href="/docs">Scalar API Reference (<code>/docs</code>)</a></li>
      <li><a href="/openapi.json">OpenAPI 3.1 Specification (<code>/openapi.json</code>)</a></li>
      <li><a href="/health">Health Check (<code>/health</code>)</a></li>
    </ul>
  </main>
</body>
</html>
