name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Format, Lint, Unit & PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing_secret
          POSTGRES_DB: event_ticketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ticketing -d event_ticketing_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./internal/... ./migrations/... ./cmd/...

      - name: Run Integration & 200-Concurrency Tests with Race Detector
        env:
          DATABASE_URL: postgres://ticketing:ticketing_secret@localhost:5432/event_ticketing_test?sslmode=disable
          JWT_SECRET: ci-jwt-secret
          WEBHOOK_SECRET: ci-webhook-secret
          ALLOW_DEMO_HEADER_AUTH: "true"
        run: go test -v -race -tags=integration ./tests/...

      - name: Validate docker-compose config
        run: docker compose config --quiet

  frontend-check:
    name: Frontend Typecheck, Lint, Unit Tests & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build, Typecheck, Lint & Unit Tests
        run: |
          bun run build
          bun run typecheck
          bun run lint
          bun run test

  build-and-push:
    name: Build & Push Commit-Tagged Images
    runs-on: ubuntu-latest
    needs: [test-and-lint, frontend-check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata with commit SHA tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      - name: Extract Frontend image metadata with commit SHA tag
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
