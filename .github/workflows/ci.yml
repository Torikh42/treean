name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-lint-unit:
    name: Go Format, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Run Unit Tests with Race Detector
        run: go test -race ./internal/... ./migrations/... ./cmd/...

  go-integration:
    name: PostgreSQL Integration & Concurrency Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ticketing_secret
          POSTGRES_DB: event_ticketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ticketing -d event_ticketing_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run Integration & 200-Concurrency Tests with Race Detector
        env:
          DATABASE_URL: postgres://ticketing:ticketing_secret@localhost:5432/event_ticketing_test?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-jwt-secret
          WEBHOOK_SECRET: ci-webhook-secret
          ALLOW_DEMO_HEADER_AUTH: "true"
        run: go test -race -tags=integration ./tests/...

      - name: Validate Nginx Gateway Config Syntax
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 \
            -v "${{ github.workspace }}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Validate docker-compose & db-debug configs
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.db-debug.yml config --quiet

  frontend-check:
    name: Frontend Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint, Typecheck, Unit Tests & Vite Build
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run build

  build-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    needs: [go-lint-unit, go-integration]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract API image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=api' || '' }}

  build-web:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Frontend image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=sha,prefix=,format=long
            type=ref,event=branch

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=web' || '' }}
