version: "2"
run:
  concurrency: 4
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    - gocritic
    - revive
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    - gocyclo
    - nestif
    - funlen
    - perfsprint
    - unconvert
    - ineffassign
    - goconst
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - containedctx
    - fatcontext
    - sloglint
    - usestdlibvars
    - intrange
    - exhaustive
    - nolintlint
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - funlen
          - goconst
  settings:
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    goconst:
      min-len: 3
      min-occurrences: 4
    gocyclo:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
