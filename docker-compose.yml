services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ticketing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketing_secret}
      POSTGRES_DB: ${POSTGRES_DB:-event_ticketing}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-ticketing} -d ${POSTGRES_DB:-event_ticketing}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      # Container always binds :8080 behind the Nginx single entry point.
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-ticketing}:${POSTGRES_PASSWORD:-ticketing_secret}@postgres:5432/${POSTGRES_DB:-event_ticketing}?sslmode=disable
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://redis:6379/0}
      REDIS_TIMEOUT: ${REDIS_TIMEOUT:-500ms}
      EVENT_CACHE_TTL: ${EVENT_CACHE_TTL:-3s}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REGISTER_MAX: ${RATE_LIMIT_REGISTER_MAX:-5}
      RATE_LIMIT_REGISTER_HARD_MAX: ${RATE_LIMIT_REGISTER_HARD_MAX:-100}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_LOGIN_IP_MAX: ${RATE_LIMIT_LOGIN_IP_MAX:-60}
      RATE_LIMIT_LOGIN_IP_HARD_MAX: ${RATE_LIMIT_LOGIN_IP_HARD_MAX:-600}
      RATE_LIMIT_ORDER_USER_MAX: ${RATE_LIMIT_ORDER_USER_MAX:-20}
      RATE_LIMIT_ORDER_IP_MAX: ${RATE_LIMIT_ORDER_IP_MAX:-0}
      RATE_LIMIT_DEMO_FLASH_SALE_MAX: ${RATE_LIMIT_DEMO_FLASH_SALE_MAX:-5}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-16}
      POW_SECRET: ${POW_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-change-in-production}
      ALLOW_DEMO_HEADER_AUTH: ${ALLOW_DEMO_HEADER_AUTH:-true}
      EXPIRY_SWEEP_INTERVAL: ${EXPIRY_SWEEP_INTERVAL:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-30s}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-50}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
