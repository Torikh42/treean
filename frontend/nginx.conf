# ---------- Edge IP Rate Limit (DDoS / runaway flood shield) ----------
# Allows 50 req/s + burst 250 nodelay per IP so 200-concurrent simulations pass cleanly
# while dropping extreme per-IP floods at Nginx with HTTP 429 before hitting Go/Redis.
limit_req_zone $binary_remote_addr zone=edge_api_limit:10m rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # ---------- Gzip compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|docs|openapi\.json|health|schemas|demo) {
        limit_req zone=edge_api_limit burst=250 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite X-Forwarded-For with $remote_addr so untrusted clients cannot spoof rate-limit IPs.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
