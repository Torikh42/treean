# ---------- Edge IP Rate Limit (DDoS / runaway flood shield) ----------
# Allows 250 req/s + burst 1000 nodelay per IP so CG-NAT shared-IP traffic and 200-concurrent
# simulations pass cleanly while dropping extreme per-IP floods at Nginx with HTTP 429 before Go/Redis.
limit_req_zone $binary_remote_addr zone=edge_api_limit:10m rate=250r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # ---------- Trusted Upstream Proxy / CDN Real-IP Restoration ----------
    # Uncomment and restrict to your trusted reverse proxy / CDN / LB CIDR blocks
    # (ngx_http_realip_module) so $remote_addr and $binary_remote_addr reflect the true client IP:
    # set_real_ip_from 10.0.0.0/8;
    # set_real_ip_from 172.16.0.0/12;
    # set_real_ip_from 192.168.0.0/16;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # ---------- Gzip compression ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api|docs|openapi\.json|health|schemas|demo) {
        limit_req zone=edge_api_limit burst=1000 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Overwrite X-Forwarded-For with $remote_addr so untrusted clients cannot spoof rate-limit IPs.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
