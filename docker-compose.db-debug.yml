# Optional override exposing internal postgres, redis, and api ports on localhost for DataGrip, direct curl, or host integration tests.
# Usage: docker compose -f docker-compose.yml -f docker-compose.db-debug.yml up -d
services:
  postgres:
    ports:
      - "${DB_DEBUG_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_DEBUG_PORT:-6379}:6379"

  api:
    ports:
      - "${API_DEBUG_PORT:-8080}:8080"
